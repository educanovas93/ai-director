apiVersion: v1
kind: Namespace
metadata:
  name: ai-director
  labels:
    app.kubernetes.io/name: ai-director
    app.kubernetes.io/managed-by: hermes
---
apiVersion: v1
kind: Service
metadata:
  name: ai-director
  namespace: ai-director
  labels:
    app.kubernetes.io/name: ai-director
    app.kubernetes.io/managed-by: hermes
spec:
  ports:
    - name: http
      port: 8765
      targetPort: 8765
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ai-director
  namespace: ai-director
  labels:
    app.kubernetes.io/name: ai-director
    app.kubernetes.io/managed-by: hermes
subsets:
  - addresses:
      - ip: 10.208.99.128
    ports:
      - name: http
        port: 8765
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ai-director
  namespace: ai-director
  labels:
    app.kubernetes.io/name: ai-director
    app.kubernetes.io/managed-by: hermes
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`10.208.99.128`)
      services:
        - name: ai-director
          port: 8765
